modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All Rights Reserved"

issueTrackerURL="https://marbledhubb.com/report-a-bug"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL="https://marbledhubb.com/projects/mods/mhs-discord-integration"
logoFile="mhs_di_icon.png"
credits="MarbledHubb Studios"
authors = "${mod_authors}"
displayTest="IGNORE_SERVER_VERSION"

description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"

side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
